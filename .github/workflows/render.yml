name: Render YouTube video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libasound2t64 \
            libxrandr2 \
            libxkbcommon-dev \
            libxfixes3 \
            libxcomposite1 \
            libxdamage1 \
            libgbm-dev \
            libcups2 \
            libcairo2 \
            libpango-1.0-0 \
            libatk-bridge2.0-0

      - name: Install npm packages
        run: npm ci

      - name: Ensure Remotion Chrome
        run: npx remotion browser ensure

      - name: Render (low RAM)
        run: npm run render:low-ram -- --gl=swangle

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: out/youtube-low-ram.mp4
          if-no-files-found: error
          retention-days: 14
